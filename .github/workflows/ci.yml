name: Validate NEXUS

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  # Keep a rerun queued until it completes instead of canceling it when
  # another validation request for the same ref is already waiting.
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: pip install -r requirements-online.txt
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Compile backend
        run: python -m compileall backend tests
      - name: Run backend tests
        run: python -m unittest discover -v
      - name: Verify API import
        run: python -c "from backend.main import app; print('API OK', app.version)"
      - name: Lint frontend
        run: npm --prefix frontend run lint
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Check excluded artifacts
        shell: bash
        run: |
          tracked=$(git ls-files | grep -E '(^|/)(\.env($|\.)|\.venv/|node_modules/|dist/)|\.(db|log)$' | grep -v '^\.env\.example$' || true)
          test -z "$tracked" || { echo "Forbidden tracked artifacts:"; echo "$tracked"; exit 1; }
